# ============================================================
# Kafka Server Configuration (KRaft Mode)
# ============================================================
# This configuration is for Kafka 4.1.x running in KRaft mode
# (without ZooKeeper dependency)

# ------------------------------------------------------------
# Node Configuration
# ------------------------------------------------------------
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:9093

# ------------------------------------------------------------
# Listeners
# ------------------------------------------------------------
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://kafka:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

# ------------------------------------------------------------
# Log Configuration
# ------------------------------------------------------------
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
min.insync.replicas=1

# Log retention
log.retention.hours=168
log.retention.check.interval.ms=300000
log.segment.bytes=1073741824

# Log cleanup
log.cleanup.policy=delete

# ------------------------------------------------------------
# Replication Configuration
# ------------------------------------------------------------
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# ------------------------------------------------------------
# Performance Tuning
# ------------------------------------------------------------
# Network threads
num.network.threads=3
num.io.threads=8

# Socket buffer sizes
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Batch and buffer configuration
replica.fetch.max.bytes=1048576
message.max.bytes=1000012

# Compression
compression.type=snappy

# ------------------------------------------------------------
# Group Coordinator Settings
# ------------------------------------------------------------
group.initial.rebalance.delay.ms=3000
group.coordinator.rebalance.protocols=classic,consumer

