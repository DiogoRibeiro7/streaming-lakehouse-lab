# ============================================================
# Flink Log4j Configuration
# ============================================================
# This configuration provides structured logging for Flink
# components with appropriate log levels and formatting
# ============================================================

# Root logger configuration
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# ------------------------------------------------------------
# Logger Levels
# ------------------------------------------------------------

# Flink core components
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Flink runtime
logger.runtime.name = org.apache.flink.runtime
logger.runtime.level = INFO

# Flink streaming
logger.streaming.name = org.apache.flink.streaming
logger.streaming.level = INFO

# Kafka connector
logger.kafka.name = org.apache.flink.connector.kafka
logger.kafka.level = INFO

# Iceberg connector
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = INFO

# Akka (used by Flink internally)
logger.akka.name = akka
logger.akka.level = WARN

# Netty
logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = WARN

# Hadoop/AWS SDK (for S3/MinIO access)
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

logger.aws.name = com.amazonaws
logger.aws.level = WARN

logger.s3.name = software.amazon.awssdk
logger.s3.level = WARN

# Reduce verbosity for common chatty libraries
logger.shaded.name = org.apache.flink.shaded
logger.shaded.level = WARN

logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN

# SQL Gateway specific logging
logger.sqlgateway.name = org.apache.flink.table.gateway
logger.sqlgateway.level = INFO

# ------------------------------------------------------------
# Suppress specific noisy loggers
# ------------------------------------------------------------
logger.leaderelection.name = org.apache.flink.runtime.leaderelection
logger.leaderelection.level = WARN

logger.rest.name = org.apache.flink.runtime.rest
logger.rest.level = INFO

# MISSING_DOC: Add log aggregation configuration for production
# MISSING_VALIDATION: Add structured JSON logging for log ingestion
