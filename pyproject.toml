[tool.poetry]
name = "streaming-lakehouse-lab"
version = "0.1.0"
description = "Production-quality streaming lakehouse with Flink, Kafka, and Iceberg"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
apache-flink = "2.1.1"  # PyFlink compatible with Flink 2.1.x
kafka-python = "^2.0.2"
pyiceberg = "^0.10.0"
psycopg2-binary = "^2.9.9"
boto3 = "^1.34.144"  # For MinIO/S3 access
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
structlog = "^25.5.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.8"
mypy = "^1.11.1"
ruff = "^0.6.1"
pre-commit = "^3.8.0"
ipython = "^8.26.0"
types-psycopg2 = "^2.9.21.20240819"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Target Python 3.12
target-version = "py312"
line-length = 100

# Exclude auto-generated and vendor directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and more
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "S608",    # SQL injection (we handle this with parameterized queries)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR2004", "PTH"]  # Allow assert, missing annotations, magic values, os.path in tests
"scripts/*" = ["S311", "T201", "ANN401"]  # Allow random, print, and Any in scripts

[tool.ruff.lint.isort]
known-first-party = ["flink_jobs"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

# Relax strict rules for specific modules
[[tool.mypy.overrides]]
module = [
    "pyflink.*",
    "kafka.*",
    "pyiceberg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=flink_jobs",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: Integration tests (deselect with '-m \"not integration\"')",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["flink_jobs"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
