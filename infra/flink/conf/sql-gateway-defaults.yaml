# ============================================================
# Flink SQL Gateway Configuration
# ============================================================
# Default configuration for SQL Gateway REST endpoint

execution:
  planner: blink
  type: streaming
  parallelism: 2
  max-parallelism: 128

configuration:
  sql-gateway.endpoint.rest.address: 0.0.0.0
  sql-gateway.endpoint.rest.port: 8083
  sql-gateway.session.idle-timeout: 10min
  sql-gateway.worker.threads.max: 100

  # JobManager connection
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.rpc.port: 6123
